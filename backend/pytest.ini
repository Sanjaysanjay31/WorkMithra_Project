[pytest]
# datetime.utcnow() is deprecated in Python 3.12+; the codebase intentionally
# stays on naive-UTC datetimes for now because DB columns are timezone-naive
# and mixing aware/aware comparisons is a riskier migration than the warning
# is worth pre-demo. Silence just this warning so real ones stay visible.
filterwarnings =
    ignore:datetime\.datetime\.utcnow\(\) is deprecated.*:DeprecationWarning
